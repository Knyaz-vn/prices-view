  const KEY = 'price-watch-key:' + P.salt;
  const err = document.getElementById('err');
  const btn = document.getElementById('go');
  const bytes = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
  const store = {
    get() { try { return localStorage.getItem(KEY); } catch (e) { return null; } },
    set(v) { try { localStorage.setItem(KEY, v); } catch (e) { /* приватний режим */ } },
    clear() {
      try { Object.keys(localStorage).filter(k => k.startsWith('price-watch-key:')).forEach(k => localStorage.removeItem(k)); } catch (e) { /* */ }
    },
  };

  if (!window.crypto || !crypto.subtle || typeof DecompressionStream === 'undefined') {
    err.textContent = 'Браузер застарий для цієї сторінки. Оновіть його або відкрийте в Chrome.';
    btn.disabled = true;
    return;
  }

  async function derive(password) {
    const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(password), 'PBKDF2', false, ['deriveKey']);
    return crypto.subtle.deriveKey(
      { name: 'PBKDF2', salt: bytes(P.salt), iterations: P.iter, hash: 'SHA-256' },
      base, { name: 'AES-GCM', length: 256 }, true, ['decrypt']);
  }

  const LOGOUT = '<p style="max-width:1240px;margin:0 auto;padding:0 20px 36px;font-size:13px">' +
    '<a href="#logout" style="color:#5E6D62">Вийти на цьому пристрої</a></p>' +
    '<script>addEventListener("hashchange",()=>{if(location.hash==="#logout")location.reload()})<\/script>';

  async function unpack(key) {
    const packed = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: bytes(P.iv) }, key, bytes(P.ct));
    const html = await new Response(new Blob([packed]).stream().pipeThrough(new DecompressionStream('gzip'))).text();
    return html.replace('</body>', LOGOUT + '</body>');
  }

  function render(html) {
    document.open();
    document.write(html);
    document.close();
  }

  if (location.hash === '#logout') {
    store.clear();
    history.replaceState(null, '', location.pathname + location.search);
  }

  const saved = store.get();
  if (saved) {
    btn.disabled = true;
    crypto.subtle.importKey('raw', bytes(saved), 'AES-GCM', false, ['decrypt'])
      .then(unpack)
      .then(render)
      .catch(() => { store.clear(); btn.disabled = false; });
  }

  document.getElementById('gate').addEventListener('submit', async e => {
    e.preventDefault();
    err.textContent = '';
    btn.disabled = true;
    btn.textContent = 'Відкриваю...';
    try {
      const key = await derive(document.getElementById('pw').value);
      let html;
      try {
        html = await unpack(key);
      } catch (x) {
        throw new Error('bad-password');
      }
      if (document.getElementById('remember').checked) {
        const raw = new Uint8Array(await crypto.subtle.exportKey('raw', key));
        store.set(btoa(String.fromCharCode(...raw)));
      }
      render(html);
    } catch (x) {
      err.textContent = x.message === 'bad-password' ? 'Невірний пароль.' : 'Не вдалося відкрити звіт. Оновіть сторінку.';
      btn.disabled = false;
      btn.textContent = 'Відкрити';
      document.getElementById('pw').select();
    }
  });
})();
